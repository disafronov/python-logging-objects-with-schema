---
name: Audit

"on":
  pull_request:
    branches:
      - main
      - rc
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  audit:
    name: "Audit"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          cache-suffix: ${{ matrix.python-version }}

      - name: Audit dependencies
        run: make audit
